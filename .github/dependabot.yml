# Keep routine updates grouped and infrequent. Security alerts are enabled separately.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # Shared with RF_Projects and the maintained RfCat checkout.
      - dependency-name: bitstring
        versions: [">=5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      workflow-dependencies:
        patterns: ["*"]
